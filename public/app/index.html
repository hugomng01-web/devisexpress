<div class="app">
  <aside class="sidebar">
    <a class="brand" href="#tableau"><span class="brand-mark"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M9 8h8l6 6v10H9z" fill="#fff"/><path d="M17 8v6h6" fill="#f59e0b"/></svg></span><span>Devis<b>Express</b></span></a>

      <a href="#prestations" data-view="prestations"><svg class="ic"><use href="#i-list"/></svg><span>Prestations</span></a>
      <a href="#profil" data-view="profil"><svg class="ic"><use href="#i-building"/></svg><span>Profil</span></a>
    </nav>
    <p class="side-foot">Sauvegarde locale ou compte facultatif.</p>
  </aside>
  <div class="main">
    <div class="account-bar">
      <button class="btn" id="account-button" aria-expanded="false" aria-controls="account-panel">Sauvegarde en ligne</button>
      <details id="usage-preferences">
        <summary>Confidentialité et mode test</summary>
        <form>
          <label><input type="checkbox" name="consent"> Participer à la mesure d’usage facultative</label>
          <label><input type="checkbox" name="test"> Mode test. Exclure mes essais des statistiques</label>
          <label>Profil déclaré <select name="profile"><option value="non_renseigne">Non renseigné</option><option value="professionnel">Artisan / professionnel</option><option value="beta">Bêta-testeur</option></select></label>
          <div><button class="btn">Enregistrer</button> <button type="button" class="btn" data-erase-usage>Retirer et effacer mes mesures</button></div>
          <output aria-live="polite"></output><a href="/confidentialite.html">Politique de confidentialité</a>
        </form>
      </details>
    </div>
    <section id="account-panel" class="account-panel" hidden>
      <p id="account-info"></p>
      <form id="account-form" hidden>
        <input type="email" name="email" aria-label="Adresse email" placeholder="Adresse email" autocomplete="email">
        <input type="password" name="password" aria-label="Mot de passe" placeholder="Mot de passe" maxlength="128">
        <button class="btn primary">Se connecter</button>
      </form>
      <div id="account-actions"></div>
      <a class="btn" id="account-google" hidden>Continuer avec Google</a>
      <p id="account-status" aria-live="polite"></p>
    </section>
    <main id="view"></main>
  </div>
